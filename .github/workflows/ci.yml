name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trade
          POSTGRES_PASSWORD: trade
          POSTGRES_DB: trade_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U trade -d trade_test"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://trade:trade@localhost:5432/trade_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -m integration -v