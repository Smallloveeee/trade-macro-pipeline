[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-pipeline"
version = "0.1.0"
description = "Trade & Macro data pipeline on public UN Comtrade and ECB data"
requires-python = ">=3.13"
dependencies = [
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trade_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100